{% extends "base.html" %}
{% block content %}
<div class="main">
    <div class="container-cv">
        <div class="cv-actions">
            {% if cv_pdf %}
            <a class="btn" href="{{ url_for('static', filename=cv_pdf) }}" download>Download PDF</a>
            {% endif %}
            <a class="btn" href="{{ url_for('contact') }}">Hire Me</a>
        </div>
        <img src="{{ url_for('static', filename='images/vc_portf.jpg') }}" alt="Curriculum vitae of Luis" class="cv-image">
    </div>
</div>
{% endblock %}
