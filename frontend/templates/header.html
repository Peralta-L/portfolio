<header>
    <div class="main-header">
        <div class="left-header">
            <a class="nav-btn brand" href="{{ url_for('index') }}" aria-label="Home">L.P.A</a>
        </div>

        <nav class="right-header" aria-label="Main navigation">
            <div class="row">
                {% set links = [('aboutme', 'About Me'),
                                ('skills', 'Skills/Certs'),
                                ('projects', 'Projects'),
                                ('contact', 'Contact')] %}
                {% for endpoint, label in links %}
                <a class="nav-btn{% if request.endpoint == endpoint %} active{% endif %}"
                   href="{{ url_for(endpoint) }}"
                   {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>{{ label }}</a>
                {% endfor %}
            </div>
        </nav>
    </div>
</header>
