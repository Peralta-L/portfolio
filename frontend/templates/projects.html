{% extends "base.html" %}
{% block scripts %}
<script src="{{ url_for('static', filename='projects.js') }}" defer></script>
{% endblock %}
{% block content %}
<div class="projects-slider" data-static="{{ url_for('static', filename='') }}">
  <button class="arrow left" id="prev-project" type="button" aria-label="Previous project">&#10094;</button>
  <button class="arrow right" id="next-project" type="button" aria-label="Next project">&#10095;</button>

  <div class="projects-container">
    <div class="projects_left">
      <div class="top-projects-header">
        <h1 id="number"></h1>
        <h2>PROJECT</h2>
        <h3 id="project_title"></h3>
      </div>

      <ul class="tech-tags" id="project_tags" aria-label="Technologies used"></ul>
      <div class="project-links" id="project_links"></div>

      <div id="description" class="text-projects" aria-live="polite"></div>
      <div class="slider-dots" id="project_dots" role="tablist" aria-label="Choose project"></div>
    </div>

    <div class="projects_right">
      <div class="right-container">
        <div class="carousel" id="carousel">
          <img id="img1" class="active" src="" alt="Project screenshot 1">
          <img id="img2" class="behind" src="" alt="Project screenshot 2">
          <img id="img3" class="behind" src="" alt="Project screenshot 3">
        </div>
      </div>
    </div>
  </div>
</div>
<noscript><p class="noscript-note">Please enable JavaScript to browse my projects.</p></noscript>
{% endblock %}
